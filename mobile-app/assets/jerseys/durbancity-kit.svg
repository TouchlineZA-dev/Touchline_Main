  </defs>
  <!-- Left Sleeve -->
  <path d="M 28 20 L 10 38 L 22 52 L 28 40 Z" fill="#0F172A" stroke="#000" stroke-width="1.2" stroke-opacity="0.25"/>
  <path d="M 10 38 L 22 52" stroke="#EAB308" stroke-width="3" stroke-linecap="round"/>
  <!-- Right Sleeve -->
  <path d="M 72 20 L 90 38 L 78 52 L 72 40 Z" fill="#0F172A" stroke="#000" stroke-width="1.2" stroke-opacity="0.25"/>
  <path d="M 90 38 L 78 52" stroke="#EAB308" stroke-width="3" stroke-linecap="round"/>
  <!-- Main Torso -->
  <path d="M 28 20 Q 50 25 72 20 L 76 86 Q 50 89 24 86 Z" fill="url(#stripes)" stroke="#000" stroke-width="1.2" stroke-opacity="0.25"/>
  
  <!-- Lighting -->
  <path d="M 28 20 Q 50 25 72 20 L 76 86 Q 50 89 24 86 Z" fill="url(#crease)"/>
  <!-- Collar -->
  <path d="M 38 20 Q 50 36 62 20 Q 50 26 38 20 Z" fill="#EAB308" stroke="#000" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Club Badge Dot -->
  <circle cx="37" cy="38" r="3.2" fill="#EAB308" opacity="0.9"/>
