[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Node 22+: supabase-js constructs a realtime client on startup, which needs a
  # native WebSocket. Node 20 has none, so every function throws on the first
  # createClient() call. Applies to all contexts, not just production.
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/v1/news/headlines"
  to = "/.netlify/functions/news"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/players"
  to = "/.netlify/functions/players"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/fixtures"
  to = "/.netlify/functions/fixtures"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/standings"
  to = "/.netlify/functions/standings"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/matches"
  to = "/.netlify/functions/matches"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
